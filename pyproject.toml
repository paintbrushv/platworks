[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "platworks"
version = "0.1.4"
description = "Umbrella package and MCP server for the plat commercial-real-estate ecosystem."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
classifiers = [
    "Intended Audience :: End Users/Desktop",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mcp>=2.3,<3",
    "anyio>=4.0",
    "httpx2>=2.13,<3",
    "jsonschema>=4.26,<5",
    "uvicorn>=0.54,<0.55; sys_platform != 'emscripten'",
    "click>=8.0",
    "packaging>=24,<27",
    # Keep the standard catalog/analysis install on prebuilt Intel macOS wheels.
    "cryptography>=48,<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
analysis = [
    "plat-multifamily-underwriting[mcp]==0.1.2",
    "plat-costmodel[server]==0.1.1",
    "plat-harness[ingest,pdf]==0.1.1",
    "plat-operations==0.1.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.1.0",
]

[project.scripts]
platworks = "platworks.cli:main"
platworks-mcp = "platworks.mcp_server:main"
platworks-mcp-http = "platworks.mcp_http:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
platworks = ["data/*.json", "data/library/*.json"]
"platworks.local_review" = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slow end-to-end tests (real stdio subprocess round-trips)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
