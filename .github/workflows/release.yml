name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/release_gate.py --tag "$RELEASE_TAG" --check-registry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
  verify:
    needs: gate
    uses: ./.github/workflows/ci.yml
  published-dependencies:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'packaging>=24,<27'
      - name: Require published analysis versions and all supported native wheels
        run: python scripts/check_published_dependencies.py
  publish:
    needs: published-dependencies
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
