name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAT_BOXSCORE_EXACT_BIN: ${{ github.workspace }}/ops-producer/boxscore/target/debug/boxscore-exact
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/checkout@v4
        with:
          repository: paintbrushv/plat-operations
          ref: e0da058007df564c23668626a4a6e131d0068854
          path: ops-producer
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ops-producer/boxscore
      - name: Build pinned exact-cent operating producer
        run: cargo build --locked --manifest-path ops-producer/boxscore/Cargo.toml --bin boxscore-exact
      - name: Install pinned financial-core backends
        run: |
          pip install -e ".[dev]"
          # Immutable implementation pins extend the recorded starting baseline.
          # PyPI releases currently lag these reviewed producer commits.
          pip install \
            git+https://github.com/paintbrushv/plat-multifamily-underwriting.git@b42764be7d0bf278272ff29ce36e0c98e2c10f5f \
            git+https://github.com/paintbrushv/plat-costmodel.git@518142ecb8771e52fcc9985237fe1a6f97a76168 \
            git+https://github.com/paintbrushv/plat-harness.git@53015df7835cc7495e40c3a4e6116dfdf4c2e213
          pip check
      - name: Verify catalog against recorded evidence
        run: python scripts/verify_catalog.py
      - name: Test (full suite, stdio e2e included)
        run: pytest -q
      - name: Lint
        run: |
          ruff check src tests scripts/verify_catalog.py
          git diff --check
