name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with sibling backends from their public repos)
        run: |
          pip install -e ".[dev]"
          # The 8 product tools wrap the sibling deterministic services; the
          # stdio e2e tests exercise them for real. Until the siblings are on
          # PyPI, install them from their public repositories.
          pip install \
            git+https://github.com/paintbrushv/plat-multifamily-underwriting.git \
            git+https://github.com/paintbrushv/plat-costmodel.git \
            git+https://github.com/paintbrushv/plat-harness.git
      - name: Test (full suite, stdio e2e included)
        run: pytest -q
      - name: Lint
        run: |
          ruff check src tests
          git diff --check || true