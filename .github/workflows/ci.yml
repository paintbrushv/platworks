name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    outputs:
      operations-sha: ${{ steps.sources.outputs.operations_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: sources
        run: |
          python - <<'PY'
          import json, os
          sources = json.load(open('release-sources.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('operations_sha=' + sources['plat-operations']['sha'] + '\n')
          PY
      - run: python scripts/release_gate.py
      - run: pip install build twine ruff
      - run: python scripts/build_components.py
      - run: twine check dist/* wheelhouse/*
      - run: ruff check src tests scripts
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels
          path: wheelhouse/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  native:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
          - os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: auto
          - os: macos-15
            target: aarch64-apple-darwin
            manylinux: auto
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            manylinux: auto
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          repository: paintbrushv/plat-operations
          ref: ${{ needs.build.outputs.operations-sha }}
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.15.0'
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
          sccache: true
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
  clean-install:
    needs: [build, native]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel, macos-15, windows-2022]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: python-wheels
          path: wheelhouse/
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: wheelhouse/
      - name: Catalog-only clean install
        run: python scripts/clean_install.py --profile catalog --wheelhouse wheelhouse --output catalog-check.json
      - name: Analysis clean install and financial/MCP workflows
        run: python scripts/clean_install.py --profile analysis --wheelhouse wheelhouse --output analysis-check.json
      - name: Full umbrella suite against installed packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pip install --require-hashes --only-binary=:all: -r requirements-analysis.lock
          pip install --no-deps wheelhouse/*.whl
          pip install pytest
          pip check
          python scripts/verify_catalog.py
          python -I -m pytest --require-installed-wheel -q
      - name: Synthetic browser review journeys
        if: runner.os == 'Linux' && matrix.python == '3.12'
        shell: bash
        run: |
          pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          python -I scripts/browser_review.py --output browser-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-evidence-${{ matrix.os }}-${{ matrix.python }}
          path: |
            *-check.json
            release-sources.json
            browser-evidence/
